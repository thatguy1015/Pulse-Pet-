<!DOCTYPE html>
<html>
<head>
    <title>PulsePet - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">PulsePet</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>
    </nav>

    <div class="form-container">
        <h1>Create your PulsePet account</h1>
        <p>Start building a memory-driven companion experience.</p>

        <form method="POST">
            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <br><br>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <a href="/login" class="small-link">Already have an account? Login here</a>
    </div>

</body>
</html>
